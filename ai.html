<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS AI // PRIVATE</title>
  <link rel="stylesheet" href="ai.css">
</head>

<body>

<header>
  <a href="index.html" class="logo">J<span>ARVIS</span></a>

  <div class="status">
    <span></span> JARVIS AI // ONLINE
  </div>

  <div id="clock">--:--:--</div>
</header>

<main>

  <a href="index.html" class="back">← RETURN TO HUB</a>

  <section class="hero">
    <p class="eyebrow">PRIVATE INSTANCE</p>
    <h1>JARVIS <span>AI</span></h1>
    <p>Your personal AI system.</p>
  </section>

  <section class="chat">

    <div class="chat-header">
      <strong>JARVIS</strong>
      <span>● ONLINE</span>
    </div>

    <div id="messages" class="messages">
      <div class="message jarvis">
        <b>JARVIS</b>
        <p>Good to see you again, Jarvis. Systems are online.</p>
      </div>
    </div>

    <div class="input-area">
      <input
        id="userInput"
        type="text"
        placeholder="Talk to JARVIS..."
        autocomplete="off"
      >

      <button id="send">SEND →</button>
    </div>

  </section>

  <section class="commands">

    <p>QUICK COMMANDS</p>

    <button data-command="/status">SYSTEM STATUS</button>
    <button data-command="/projects">PROJECTS</button>
    <button data-command="/gaming">GAMING</button>
    <button data-command="/creator">CREATOR</button>
    <button data-command="/help">HELP</button>

  </section>

</main>

<footer>
  JARVIS HUB // PRIVATE AI INSTANCE
</footer>

<script src="ai.js"></script>

</body>
</html>
